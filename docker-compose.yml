services:
  go_marry_db:
    container_name: go_marry_db
    image: postgres:latest
    env_file:
      - .env
    ports:
        - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  go_marry_api:
    container_name: go_marry_api
    image: go_marry_api:latest
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - go_marry_db
volumes:
  pgdata: {}
